<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelley Autoplex widget — dev test</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: #15161E; margin: 0; padding: 32px 16px; font-family: Inter, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { color: #F8F9FB; font-weight: 600; }
    p.note { color: #A4ABB8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Booking widget — local test harness</h1>
    <p class="note">
      Served by <code>uvicorn api.server:app</code>. Talks to the same origin
      for <code>/api/booking/*</code>. Open DevTools network panel to watch
      events fire.
    </p>
    <div id="kelley-booking-widget"></div>
  </div>

  <script src="/widgets/kelley-booking-widget.js"></script>
  <script>
    KelleyBookingWidget.init({
      containerId: 'kelley-booking-widget',
      apiBaseUrl: window.location.origin
    });
  </script>
</body>
</html>
